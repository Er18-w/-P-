<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>批量修图</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">P</div>
          <div>
            <h1>批量修图</h1>
            <p>所有图片仅在本机浏览器中处理</p>
          </div>
        </div>

        <section class="panel">
          <h2>图片素材</h2>
          <label class="drop-zone" for="imageInput">
            <span>添加图片</span>
            <small>JPG、PNG、WebP，可多选或拖入</small>
          </label>
          <input id="imageInput" type="file" accept="image/*" multiple />
          <label class="compact-field">
            处理范围
            <select id="exportScope">
              <option value="ratio">当前比例组</option>
              <option value="all">全部图片</option>
            </select>
          </label>
        </section>

        <section class="panel">
          <div class="section-heading">
            <h2>Logo 库</h2>
            <label class="icon-upload" for="logoInput" title="添加 Logo">+</label>
          </div>
          <input id="logoInput" type="file" accept="image/*" multiple />
          <div id="logoLibrary" class="logo-library"><p class="hint">添加透明 PNG 后，会保存在本次工作中。</p></div>
          <label class="compact-field">
            当前 Logo 名称
            <input id="logoName" type="text" placeholder="例如：白色横排" />
          </label>
          <label class="compact-field">
            Logo 分组
            <input id="logoGroup" type="text" placeholder="例如：品牌主标" />
          </label>
        </section>

        <section class="panel">
          <h2>Logo 位置</h2>
          <div class="segmented" role="group" aria-label="Logo 位置">
            <button class="active" data-position="bottom-right">右下</button>
            <button data-position="bottom-left">左下</button>
            <button data-position="top-right">右上</button>
            <button data-position="top-left">左上</button>
            <button data-position="center">居中</button>
            <button data-position="smart">智能避色</button>
          </div>
          <label>Logo 宽度 <output id="logoSizeValue">18%</output><input id="logoSize" type="range" min="4" max="60" value="18" /></label>
          <label>边距 <output id="logoMarginValue">4%</output><input id="logoMargin" type="range" min="0" max="20" value="4" /></label>
          <label>透明度 <output id="logoOpacityValue">92%</output><input id="logoOpacity" type="range" min="10" max="100" value="92" /></label>
        </section>

        <section class="panel">
          <h2>基础修图</h2>
          <label>亮度 <output id="brightnessValue">0</output><input id="brightness" type="range" min="-60" max="60" value="0" /></label>
          <label>对比度 <output id="contrastValue">8</output><input id="contrast" type="range" min="-60" max="60" value="8" /></label>
          <label>饱和度 <output id="saturationValue">8</output><input id="saturation" type="range" min="-60" max="80" value="8" /></label>
          <label class="checkbox"><input id="sharpen" type="checkbox" /><span>轻微锐化</span></label>
        </section>

        <section class="panel">
          <h2>高清导出</h2>
          <div class="field-row">
            <label>格式<select id="format"><option value="image/jpeg">JPG</option><option value="image/webp">WebP</option><option value="image/png">PNG</option></select></label>
            <label>质量 <output id="qualityValue">92%</output><input id="quality" type="range" min="50" max="100" value="92" /></label>
          </div>
          <button id="downloadCurrent" class="action ghost" disabled>下载当前图片</button>
          <button id="downloadZip" class="action" disabled>导出并打包 ZIP</button>
        </section>
      </aside>

      <section class="workspace">
        <div class="topbar">
          <div><strong id="fileCount">0 张图片</strong><span id="statusText">添加图片后开始处理</span></div>
          <div class="toolbar"><label>查看比例<select id="ratioFilter"><option value="all">全部</option></select></label><button id="clearAll" class="small-button" disabled>清空</button></div>
        </div>
        <div class="preview-wrap">
          <canvas id="previewCanvas" width="1200" height="800"></canvas>
          <div id="emptyState" class="empty-state"><strong>添加图片和 Logo</strong><span>选择一个比例组，设置一次规则，批量完成整组图片。</span></div>
        </div>
        <div id="thumbs" class="thumbs" aria-label="图片列表"></div>
      </section>
    </main>
    <script src="./app.js"></script>
  </body>
</html>
